<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Turnstile Test | Xenolith</title>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f4f4f1;
      color: #222;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(92vw, 680px);
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 18px;
      padding: 32px;
      box-shadow: 0 18px 50px rgba(0,0,0,.08);
    }
    h1 { margin: 0 0 10px; font-size: 24px; }
    p { line-height: 1.7; }
    .widget-wrap { margin: 28px 0; min-height: 70px; display:flex; align-items:center; }
    #status {
      margin-top: 20px;
      padding: 14px 16px;
      border-radius: 10px;
      background: #f6f6f6;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Cloudflare Turnstile 最小構成テスト</h1>
    <p>Xenolith本体のCONTACT実装を使わず、Turnstileだけを最小構成で確認する一時テストページです。</p>

    <div class="widget-wrap">
      <div
        class="cf-turnstile"
        data-sitekey="0x4AAAAAAFcZhSgkxJrymrO-"
        data-theme="light"
        data-callback="turnstileSuccess"
        data-error-callback="turnstileError"
        data-expired-callback="turnstileExpired"
        data-timeout-callback="turnstileTimeout"
      ></div>
    </div>

    <div id="status">読み込み中です…</div>
  </main>

  <script>
    const statusEl = document.getElementById('status');

    window.turnstileSuccess = function(token) {
      statusEl.textContent = 'SUCCESS\nTurnstile token obtained.\nToken length: ' + token.length;
    };

    window.turnstileError = function(code) {
      statusEl.textContent = 'ERROR\nTurnstile error code: ' + code;
    };

    window.turnstileExpired = function() {
      statusEl.textContent = 'EXPIRED\nTurnstile token expired.';
    };

    window.turnstileTimeout = function() {
      statusEl.textContent = 'TIMEOUT\nTurnstile challenge timed out.';
    };
  </script>
</body>
</html>
